name: Build NovaDM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack project
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem *.zip | Select-Object -First 1).FullName -DestinationPath src
      - name: Install dependencies
        shell: pwsh
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Download video tools (yt-dlp, deno, ffmpeg)
        shell: pwsh
        continue-on-error: true
        run: |
          $ProgressPreference = 'SilentlyContinue'
          cd src
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools\yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "deno.zip"
          Expand-Archive -Path deno.zip -DestinationPath tools -Force
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffx -Force
          Get-ChildItem ffx -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination tools
          Get-ChildItem tools | Select-Object Name, Length
      - name: Build NovaDM.exe
        shell: pwsh
        run: |
          cd src
          pyinstaller --noconfirm --onefile --windowed --name NovaDM --icon app.ico --add-data "novadm/ui;novadm/ui" --add-data "extension;extension" --collect-data certifi --hidden-import pystray._win32 main.py
      - name: Smoke test (start the exe, check the UI files are inside)
        shell: pwsh
        continue-on-error: true
        run: |
          cd src
          $env:NOVADM_HOME = "$PWD\smoke_home"
          Start-Process -FilePath "dist\NovaDM.exe" -ArgumentList "--no-window","--port","9701"
          Start-Sleep -Seconds 12
          $r = Invoke-RestMethod -Uri "http://127.0.0.1:9701/ping" -Headers @{"X-NovaDM"="1"}
          if ($r.app -ne "NovaDM") { throw "ping failed" }
          $css = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:9701/static/app.css"
          if ($css.StatusCode -ne 200) { throw "UI files missing" }
          Write-Host "Smoke test OK: NovaDM $($r.version) is running and serves its UI"
          Stop-Process -Name NovaDM -Force
      - name: Show app log if something went wrong
        if: failure()
        shell: pwsh
        run: Get-Content "$env:APPDATA\NovaDM\novadm.log" -ErrorAction SilentlyContinue
      - name: Make portable folder
        shell: pwsh
        run: |
          cd src
          New-Item -ItemType Directory -Force -Path portable\NovaDM | Out-Null
          Copy-Item dist\NovaDM.exe portable\NovaDM\
          if (Test-Path tools) { Copy-Item tools portable\NovaDM\tools -Recurse }
      - name: Build installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          cd src
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: NovaDM-portable
          path: src/portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaDM-installer
          path: src/installer_out/NovaDM-Setup.exe
          if-no-files-found: ignore
